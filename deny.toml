[bans]
# ignore that for now
multiple-versions = "allow"

# the store is reached through the order rules, or by the app that plugs it in
[[bans.deny]]
name = "shop-store"
wrappers = ["shop-orders", "shop-app"]

# the in-memory store is a test double: shop-web takes it as a dev-dependency only,
# so it never ends up in the program shop-app builds
[[bans.deny]]
name = "shop-store-in-mem"
wrappers = ["shop-web"]

# the database driver lives behind the store, nobody else gets a connection
[[bans.deny]]
name = "postgres"
wrappers = ["shop-store"]
